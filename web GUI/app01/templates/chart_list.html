{% extends 'layoyt.html' %}
{% load static %}

{% block content %}


    <div class="container">
        <div class="panel panel-default">
            <div class="panel-heading">心率血氧折线图</div>
            <div class="panel-body">
                <div id="m1" style="width: 100%;height: 500px"></div>
            </div>
        </div>
        <div class="row">

            <div class="col-sm-8">
                <div class="panel panel-default">
                    <div class="panel-heading">温度湿度折线图</div>
                    <div class="panel-body">
                        <div id="m2" style="width: 100%; height: 400px;"></div>
                    </div>
                </div>
            </div>

            <div class="col-sm-4">
                <div class="panel panel-default">
                    <div class="panel-heading">饼图</div>
                    <div class="panel-body">
                        <div id="m3" style="width: 100%;height: 400px"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}

{% block js %}
    <script src="{% static 'js/echarts.js' %}"></script>
    <script type="text/javascript">

        $(function () {
            initline();
            initBar();
            initPie();
        })

        /**
         * 初始化心率，血氧折线图
         * **/
        function initline() {
            // 基于准备好的dom，初始化echarts实例
            var myChart = echarts.init(document.getElementById('m1'));

            var option = {
                title: {
                    text: '身体数据指标变化',
                    left: "center"
                },
                tooltip: {
                    trigger: 'axis'
                },
                legend: {
                    data: [],
                    bottom:0
                },
                toolbox: {
                    feature: {
                        saveAsImage: {}
                    }
                },
                xAxis: {
                    type: 'category',
                    boundaryGap: false,
                    data: []
                },
                yAxis: {
                    type: 'value'
                },
                series: [],
            };

            $.ajax({
                url:'/chart/line/',
                type:"get",
                dataType:"JSON",
                success: function (res) {
                    if(res.status){
                        option.legend.data = res.data.legend;
                        option.xAxis.data = res.data.x_axis;
                        option.series = res.data.series_list;

                        // 使用刚指定的配置项和数据显示图表。
                        myChart.setOption(option);
                    }
                }
            })

            // 使用刚指定的配置项和数据显示图表。
            myChart.setOption(option);
        }

        /**
         * 初始化温度，湿度状图
         * **/
        function initBar() {
            // 基于准备好的dom，初始化echarts实例
            var myChart = echarts.init(document.getElementById('m2'));

            // 指定图表的配置项和数据
            var option = {
                title: {
                    text: '室内环境变化',
                    left: "center"
                },
                tooltip: {
                    trigger: 'axis'
                },
                legend: {
                    data: [],
                    bottom:0
                },
                toolbox: {
                    feature: {
                        saveAsImage: {}
                    }
                },
                xAxis: {
                    type: 'category',
                    boundaryGap: false,
                    data: []
                },
                yAxis: {
                    type: 'value'
                },
                series: []
            };

            $.ajax({
                url: "/chart/bar/",
                type: "get",
                dataType: "JSON",
                success: function (res) {
                    // 将后台返回的数据更新进去
                    if (res.status) {
                        option.legend.data = res.data.legend;
                        option.xAxis.data = res.data.x_axis;
                        option.yAxis.data = res.data.y_axis;
                        option.series = res.data.series_list;

                        // 使用刚指定的配置项和数据显示图表。
                        myChart.setOption(option);
                    }
                    //
                }

            })
        }

        /**
         * 初始化饼状图
         * **/
        function initPie() {
            // 基于准备好的dom，初始化echarts实例
            var myChart = echarts.init(document.getElementById('m3'));

            var option = {
                title: {
                    text: '空气质量占比',
                    left: 'center'
                },
                tooltip: {
                    trigger: 'item'
                },
                legend: {
                    bottom: 0
                },
                series: [
                    {
                        name: '空气质量',
                        type: 'pie',
                        radius: '50%',
                        data: [
                            {value: 1048, name: '高'},
                            {value: 735, name: '中'},
                            {value: 580, name: '低'},
                        ],
                        emphasis: {
                            itemStyle: {
                                shadowBlur: 10,
                                shadowOffsetX: 0,
                                shadowColor: 'rgba(0, 0, 0, 0.5)'
                            }
                        }
                    }
                ]
            };

            $.ajax({
                url: "/chart/pie/",
                type: "get",
                dataType: "JSON",
                success: function (res) {
                    if (res.status) {
                        option.series[0].data = res.data;
                        myChart.setOption(option)
                    }
                }
            })

            // 使用刚指定的配置项和数据显示图表。
            myChart.setOption(option);
        }

    </script>
{% endblock %}
